<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch-zoom stays allowed (no user-scalable=no). interactive-widget=resizes-content makes Android Chrome (108+) shrink the page
         when the keyboard opens, so a bar pinned to the bottom of the screen (ui/molecules/ActionBar) sits above the keyboard. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <!-- Light only: floor screens are read in bright light, and a phone browser's "dark mode for websites" must not recolour the status colours. -->
    <meta name="color-scheme" content="light" />
    <!-- The app has its own language switch. Without this a phone whose language is English offers to translate the Tamil page, and a machine translation of our status words is not something anyone has checked. -->
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#F6F5F9" />
    <link rel="icon" href="data:," />
    <title>Order tracking</title>
    <!-- First-paint shell (UI/UX plan, slice 4.5). Measured on an emulated Slow 3G with a 4x slower processor the first content came after
         3.3 s; this fills the wait with the page colour and a ring, so the screen does not look broken. No words, so nothing to translate.
         The colours are the design tokens' --page, --border and --accent, written out because no stylesheet has loaded yet
         (test/bootShell.test.ts keeps them equal). The app clears #boot when it mounts. -->
    <style>
      html { background: #F6F5F9; }
      .boot { display: grid; place-items: center; min-height: 100vh; }
      .boot__ring { width: 32px; height: 32px; border-radius: 50%; border: 4px solid #8A85A0; border-top-color: #6E5BB1; animation: boot-spin 900ms linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot__ring { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" class="boot" aria-hidden="true"><span class="boot__ring"></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
