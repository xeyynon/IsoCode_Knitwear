name: ci

# Pull requests and pushes to main. Tags are handled by release.yml, so a tag push no
# longer runs CI a second time.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request replaces the run in progress. A push to main is never cancelled by the next one: its group is its
# own commit, so a red commit on main always ends with a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # tags and commit titles are checked
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Secrets, tracked files, commit titles, tags
        run: node scripts/check_repo.mjs
        env:
          BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
          # Opt in: once the BANNED_TERMS secret exists, set the repository variable REQUIRE_BANNED_TERMS to 1 and an empty list fails the run on pushes and on pull requests from this repository. Pull requests from forks and from
          # Dependabot get no secrets, so there the guard cannot run: check_repo says so in the log and the merge to main runs it.
          REQUIRE_BANNED_TERMS: ${{ vars.REQUIRE_BANNED_TERMS == '1' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')) && '1' || '' }}
      - name: Markdown links
        run: node scripts/check_docs.mjs
      - name: Colour contrast of the design tokens
        run: node scripts/check_contrast.mjs
      - name: Bug log and fix log agree
        run: node scripts/check_bugs.mjs

  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (web and engine, server without browser types, scripts and config files)
        run: npm run typecheck
      - name: Tests (engine, API, database and row-level security, web logic)
        run: npm test

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://api.example.invalid   # a placeholder: the build only needs the variable to exist

  # The same server tests as `test`, but on a real Postgres 16 instead of PGlite (Postgres in WebAssembly):
  # a second connection, a connection pool, a role that logs in (app_user) and true concurrent
  # transactions. TEST_DATABASE_URL switches packages/server/test/helpers.ts to the production pg driver;
  # each test file gets its own throwaway database on this server, so files can run in parallel.
  test-postgres:
    name: Database tests on Postgres 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Server tests on Postgres 16 (migrations, services, API, row-level security)
        run: npm run test:pg

      # db/tests/rls.test.sql is plain Postgres. It is meant to run after the migrations, as a table
      # owner that is NOT a superuser (a superuser bypasses even FORCE ROW LEVEL SECURITY and would prove
      # nothing), and it needs to act as app_user, so the owner is made a member of that role.
      # The migrations are applied by the real runner (npm run migrate); psql is used only to create the role and database,
      # to grant the membership, and to run rls.test.sql.
      - name: Row-level security SQL as a non-superuser owner, with psql
        env:
          PGHOST: localhost
          PGPORT: '5432'
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
          psql --version
          export PGUSER=postgres PGPASSWORD=postgres
          psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          create role rls_owner nosuperuser createrole login password 'rls_owner';
          create database rls_ci owner rls_owner;
          SQL
          export PGUSER=rls_owner PGPASSWORD=rls_owner
          # The real migration runner (npm run migrate), connected as the same non-superuser owner the psql loop used: each
          # migration in its own transaction, recorded in schema_migrations, so this step also exercises what production runs.
          DATABASE_URL=postgres://rls_owner:rls_owner@localhost:5432/rls_ci npm run migrate
          PGUSER=postgres PGPASSWORD=postgres psql -v ON_ERROR_STOP=1 -d rls_ci -c 'grant app_user to rls_owner'
          psql -v ON_ERROR_STOP=1 -d rls_ci -c 'select rolsuper, rolbypassrls from pg_roles where rolname = current_user'
          psql -v ON_ERROR_STOP=1 -d rls_ci -f packages/server/db/tests/rls.test.sql
