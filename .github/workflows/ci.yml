name: ci

# Pull requests and pushes to main. Tags are handled by release.yml, so a tag push no
# longer runs CI a second time.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags and commit titles are checked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Secrets, tracked files, commit titles, tags
        run: node scripts/check_repo.mjs
        env:
          BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
      - name: Markdown links
        run: node scripts/check_docs.mjs
      - name: Colour contrast of the design tokens
        run: node scripts/check_contrast.mjs

  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (engine, API, database and row-level security, web logic)
        run: npm test

  web-build:
    name: Web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://api.example.invalid   # a placeholder: the build only needs the variable to exist

# Still to add: Playwright offline-sync tests, and a real Postgres service container for the database tests.
